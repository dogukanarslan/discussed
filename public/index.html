<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discussed</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Messages</h1>
      <div id="message-list"></div>
      <form class="message-form">
        <div>
          <label for="name">Username</label>
          <input id="name" type="text" placeholder="Username" />
        </div>

        <div>
          <label for="message">Message</label>
          <input
            id="message"
            type="text"
            placeholder="Write something"
            required
          />
        </div>

        <button class="btn">Send</button>
      </form>
    </div>
    <script>
      const socket = io();

      const $name = document.querySelector('#name');
      const $message = document.querySelector('#message');
      const $messages = document.querySelector('#message-list');
      $messages.classList.add('message-list');
      const $form = document.querySelector('form');

      let messages = [];
      $form.addEventListener('submit', function (e) {
        e.preventDefault();
        const name = $name.value;
        const message = $message.value;
        $message.value = '';

        fetch(`/messages`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: name,
            message
          })
        });
      });

      const createMessageEl = (username, message) => {
        console.log(username);
        const $messageContainer = document.createElement('div');
        $messageContainer.classList.add('message');
        const $name = document.createElement('h4');
        const $message = document.createElement('p');
        $name.textContent = username;
        $message.textContent = message;
        $messageContainer.appendChild($name);
        $messageContainer.appendChild($message);
        return $messageContainer;
      };

      const getMessages = () => {
        fetch(`/messages`)
          .then((res) => res.json())
          .then((data) => {
            data.forEach((message) => {
              $messages.appendChild(
                createMessageEl(message.username, message.message)
              );
            });
          });
      };

      getMessages();

      socket.on('message', (data) => {
        console.log(data)
        $messages.appendChild(createMessageEl(data.username, data.message));
      });
    </script>
  </body>
</html>
